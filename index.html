<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Cards</title>
  <link rel="stylesheet" href="style/style.css">
</head>

<body>
  <div class="page">
    <h1 class="h1">Выбери свой продукт</h1>
    <div class="buttons">
      <button id="recolor-first-card-button">перекрасить фон первой карточки</button>
      <button id="recolor-all-card-button">перекрасить фон всех карточек</button>
      <button id="open-google-button">открыть google</button>
    </div>
    <div class="product-card-wrapper">
      <!--Сюда будут добавляться карточки через JS -->
    </div>
  </div>

  <!-- ФУТЕР -->
  <footer class="footer">
    <div class="footer__container">
      <div class="footer__brand">
        <h3>Product Cards</h3>
        <p>У нас самые лучшие продукты для кожи!</p>
      </div>
      <nav class="footer__nav" aria-label="Быстрые ссылки">
        <h4>Быстрые ссылки</h4>
        <ul>
          <li><a href="#">Главная</a></li>
          <li><a href="#">Магазин</a></li>
          <li><a href="#">Контакты</a></li>
        </ul>
      </nav>
      <div class="footer__subscribe">
        <h4>Подпишись на наши акции:</h4>
        <form id="subscribeForm" class="subscribe-form">
          <input type="email" id="subEmail" placeholder="Введи Email..." required>
          <button type="submit">Подписаться</button>
        </form>
      </div>
    </div>
    <div class="footer__copyright">
      <p>www.product-cards.com © all right reserved</p>
    </div>
  </footer>

  <!-- КНОПКА РЕГИСТРАЦИИ -->
  <button id="registerBtn" class="register-btn">Регистрация</button>

  <!-- МОДАЛЬНОЕ ОКНО -->
  <div id="modal" class="modal">
    <div class="modal__overlay"></div>
    <div class="modal__content">
      <button class="modal__close" id="closeModalBtn">&times;</button>
      <h2>Регистрация</h2>
      <form id="registerForm" class="register-form">
        <label>Имя: <input type="text" name="firstName" required placeholder="Иван"></label>
        <label>Фамилия: <input type="text" name="lastName" required placeholder="Иванов"></label>
        <label>Дата рождения: <input type="date" name="birthDate" required></label>
        <label>Логин: <input type="text" name="login" required placeholder="ivan123"></label>
        <label>Пароль: <input type="password" name="password" required placeholder="******"></label>
        <label>Повтор пароля: <input type="password" name="confirmPassword" required placeholder="******"></label>
        <button type="submit">Зарегистрироваться</button>
      </form>
    </div>
  </div>

  <!-- СКРИПТЫ (модули) -->

  <script type="module" src="script/homework-5.js"></script>
  <script type="module" src="script/homework-6.js"></script>
  <script type="module" src="script/homework-7.js"></script>
  <script type="module" src="script/homework-8.js"></script>
  <script type="module" src="script/homework-9.js"></script>

</body>

</html>
